name: PR18 Auto Tour Remediation

on:
  push:
    branches:
      - feat/multi-destination-reference-parity-immersive

permissions:
  contents: write

concurrency:
  group: pr18-auto-tour-remediation
  cancel-in-progress: false

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write regression test first
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/modules/immersive-navigation/ui/ImmersiveExperience.test.tsx')
          text = path.read_text()
          start_marker = "  it('advances the explicit demo tour through Auto Tour after the current scene commits', async () => {"
          end_marker = "\n  it('uses the selected local anchor mapping as the only 360 handoff', async () => {"
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = """  it('advances the explicit demo tour forward without bouncing on bidirectional links', async () => {
            const { factories } = createFactories();

            renderExperience(
              '/explore/bien-thien-cam/immersive?mode=panorama&scene=thien-cam-boardwalk',
              factories,
              getDemoManifest('bien-thien-cam', 'synthetic'),
              DEMO_DESTINATIONS.map(({ preview }) => preview),
              [],
              'none',
              'demo',
              'synthetic',
            );

            const autoTourButton = await screen.findByRole('button', { name: 'Tự động tham quan' });
            await waitFor(() => expect(autoTourButton).not.toBeDisabled());
            vi.useFakeTimers();
            fireEvent.click(autoTourButton);

            const advanceAutoTour = async () => {
              await act(async () => {
                await vi.advanceTimersByTimeAsync(6500);
                await Promise.resolve();
                await Promise.resolve();
              });
            };

            await advanceAutoTour();
            expect(screen.getByTestId('location')).toHaveTextContent(/scene=thien-cam-shore/);

            await advanceAutoTour();
            expect(screen.getByTestId('location')).toHaveTextContent(/scene=thien-cam-lookout/);

            await advanceAutoTour();
            expect(screen.getByTestId('location')).toHaveTextContent(/scene=thien-cam-lookout/);
            expect(useImmersiveNavigation.getState().committedSceneId).toBe('thien-cam-lookout');
          });
"""
          path.write_text(text[:start] + replacement + text[end:])
          PY
          pnpm exec prettier --write apps/web/src/modules/immersive-navigation/ui/ImmersiveExperience.test.tsx

      - name: Verify RED
        run: |
          set +e
          pnpm --filter @hatinh/web exec vitest run src/modules/immersive-navigation/ui/ImmersiveExperience.test.tsx -t "advances the explicit demo tour forward without bouncing on bidirectional links" > /tmp/pr18-red.log 2>&1
          status=$?
          set -e
          cat /tmp/pr18-red.log
          if [ "$status" -eq 0 ]; then
            echo "Expected regression test to fail before implementation, but it passed."
            exit 1
          fi
          grep -q "thien-cam-lookout" /tmp/pr18-red.log
          echo "RED_CONFIRMED"

      - name: Implement ordered forward Auto Tour
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/modules/immersive-navigation/ui/ImmersiveExperience.tsx')
          text = path.read_text()
          old = """        getNextSceneId: (sceneId) => {
          const outgoingLink = panoramaTourLinks.find(
            (link) =>
              link.sourceSceneId === sceneId &&
              panoramaRenderableNodes.some((node) => node.id === link.targetSceneId),
          );
          if (outgoingLink) {
            return outgoingLink.targetSceneId;
          }

          const currentIndex = panoramaRenderableNodes.findIndex((node) => node.id === sceneId);
          if (currentIndex < 0 || panoramaRenderableNodes.length < 2) {
            return null;
          }

          return (
            panoramaRenderableNodes[(currentIndex + 1) % panoramaRenderableNodes.length]?.id ?? null
          );
        },
"""
          new = """        getNextSceneId: (sceneId) => {
          const currentIndex = panoramaRenderableNodes.findIndex((node) => node.id === sceneId);
          const nextNode =
            currentIndex >= 0 ? panoramaRenderableNodes[currentIndex + 1] : undefined;
          if (!nextNode) {
            return null;
          }

          const hasForwardLink = panoramaTourLinks.some(
            (link) => link.sourceSceneId === sceneId && link.targetSceneId === nextNode.id,
          );
          return hasForwardLink ? nextNode.id : null;
        },
"""
          if text.count(old) != 1:
            raise SystemExit(f'Expected exactly one Auto Tour block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write apps/web/src/modules/immersive-navigation/ui/ImmersiveExperience.tsx

      - name: Verify GREEN focused regression
        run: pnpm --filter @hatinh/web exec vitest run src/modules/immersive-navigation/ui/ImmersiveExperience.test.tsx -t "advances the explicit demo tour forward without bouncing on bidirectional links"

      - name: Verify web unit suite
        run: pnpm --filter @hatinh/web test

      - name: Verify lint
        run: pnpm --filter @hatinh/web lint

      - name: Verify typecheck
        run: pnpm --filter @hatinh/web typecheck

      - name: Verify architecture
        run: pnpm architecture:check

      - name: Verify build
        run: pnpm --filter @hatinh/web build

      - name: Verify bundle budget
        run: pnpm --filter @hatinh/web check:bundle

      - name: Commit remediation to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/modules/immersive-navigation/ui/ImmersiveExperience.tsx apps/web/src/modules/immersive-navigation/ui/ImmersiveExperience.test.tsx
          git diff --cached --check
          git commit -m "fix(web): advance auto tour through ordered scenes"
          git push origin HEAD:feat/multi-destination-reference-parity-immersive
