name: Recon Hà Tĩnh 360 public viewer

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recon:
    if: github.head_ref == 'content-readiness-audit' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @hatinh/web exec playwright install --with-deps chromium

      - name: Inspect public Hà Tĩnh 360 viewer
        shell: bash
        run: |
          cp tooling/content-readiness/recon-hatinh360.mjs apps/web/.recon-hatinh360.mjs
          cd apps/web
          RECON_OUT="../../artifact/hatinh360-recon" node .recon-hatinh360.mjs

      - name: Show reconnaissance summary
        run: |
          cat artifact/hatinh360-recon/summary.json
          echo '--- candidate sample ---'
          python - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path('artifact/hatinh360-recon/candidates.json').read_text())
          for row in rows[:80]:
              print(row.get('status'), row.get('resourceType'), row.get('contentType'), row.get('url'))
          PY

      - name: Upload reconnaissance artifact
        uses: actions/upload-artifact@v4
        with:
          name: hatinh360-public-recon
          path: artifact/hatinh360-recon
          if-no-files-found: error
          retention-days: 7
