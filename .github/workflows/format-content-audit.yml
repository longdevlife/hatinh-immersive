name: Format content audit workspace

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    if: github.head_ref == 'content-readiness-audit' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Format audit files
        run: pnpm exec prettier --write 'content-readiness/**/*.{json,md}' 'tooling/content-readiness/**/*.mjs' '.github/workflows/package-demo-360.yml' '.github/workflows/recon-hatinh360.yml' '.github/workflows/format-content-audit.yml'

      - name: Verify formatting
        run: pnpm exec prettier --check 'content-readiness/**/*.{json,md}' 'tooling/content-readiness/**/*.mjs' '.github/workflows/package-demo-360.yml' '.github/workflows/recon-hatinh360.yml' '.github/workflows/format-content-audit.yml'

      - name: Package formatted files
        run: tar -czf formatted-content-audit.tgz content-readiness tooling/content-readiness .github/workflows/package-demo-360.yml .github/workflows/recon-hatinh360.yml .github/workflows/format-content-audit.yml

      - name: Upload formatted workspace
        uses: actions/upload-artifact@v4
        with:
          name: formatted-content-audit
          path: formatted-content-audit.tgz
          if-no-files-found: error
          retention-days: 2
