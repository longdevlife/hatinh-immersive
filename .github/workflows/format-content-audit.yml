name: Format content audit workspace

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'content-readiness-audit' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: content-readiness-audit

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Format audit files
        run: pnpm exec prettier --write 'content-readiness/**/*.{json,md}' 'tooling/content-readiness/**/*.mjs' '.github/workflows/package-demo-360.yml' '.github/workflows/recon-hatinh360.yml' '.github/workflows/format-content-audit.yml'

      - name: Verify formatting
        run: pnpm exec prettier --check 'content-readiness/**/*.{json,md}' 'tooling/content-readiness/**/*.mjs' '.github/workflows/package-demo-360.yml' '.github/workflows/recon-hatinh360.yml' '.github/workflows/format-content-audit.yml'

      - name: Commit formatter output when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No formatting changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content-readiness tooling/content-readiness .github/workflows/package-demo-360.yml .github/workflows/recon-hatinh360.yml .github/workflows/format-content-audit.yml
          git commit -m 'chore: format content readiness audit'
          git push origin HEAD:content-readiness-audit
