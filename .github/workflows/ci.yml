name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://hatinh:hatinh@127.0.0.1:55432/hatinh_immersive
  S3_ENDPOINT: http://127.0.0.1:59000
  S3_REGION: us-east-1
  S3_ACCESS_KEY_ID: hatinh
  S3_SECRET_ACCESS_KEY: hatinhminio
  S3_BUCKET: hatinh-immersive-media
  S3_FORCE_PATH_STYLE: 'true'
  CORS_ORIGINS: http://127.0.0.1:4173,http://127.0.0.1:4174

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: hatinh_immersive
          POSTGRES_USER: hatinh
          POSTGRES_PASSWORD: hatinh
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U hatinh -d hatinh_immersive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start MinIO
        run: >-
          docker run --detach --name ci-minio --publish 59000:9000
          --env MINIO_ROOT_USER=hatinh --env MINIO_ROOT_PASSWORD=hatinhminio
          minio/minio:RELEASE.2024-06-13T22-53-53Z server /data --console-address ':9001'

      - name: Wait for MinIO
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:59000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Repository smoke check
        run: pnpm repo:smoke

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Architecture check
        run: pnpm architecture:check

      - name: Dead-code check
        run: pnpm deadcode

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Integration tests
        run: pnpm test:integration

      - name: Build applications
        run: pnpm build

      - name: Web bundle budget
        run: pnpm --filter @hatinh/web check:bundle

      - name: Install Playwright browser
        run: pnpm --filter @hatinh/web exec playwright install --with-deps chromium

      - name: Critical-path end-to-end tests
        run: pnpm test:e2e

      - name: Deterministic panorama lifecycle performance end-to-end test
        run: pnpm --filter @hatinh/web test:e2e:panorama-lifecycle

      - name: Deterministic MapLibre minimap end-to-end test
        run: pnpm --filter @hatinh/web test:e2e:minimap

      - name: Deterministic real MapLibre Explore end-to-end test
        run: pnpm --filter @hatinh/web test:e2e:explore-map

      - name: Production MapLibre worker end-to-end test
        run: pnpm --filter @hatinh/web test:e2e:explore-map:worker

      - name: Deterministic Hybrid Explore Map controls end-to-end test
        run: pnpm --filter @hatinh/web test:e2e:explore-map:hybrid

      - name: Production-build Selected 3D lifecycle end-to-end test
        run: pnpm --filter @hatinh/web test:e2e:selected-3d

      - name: Production-build navigation return-context end-to-end test
        run: pnpm --filter @hatinh/web test:e2e:navigation

      - name: Production-build panorama tour end-to-end test
        run: pnpm --filter @hatinh/web test:e2e:panorama-tour

      - name: Production-build public panorama media quality end-to-end test
        run: pnpm --filter @hatinh/web test:e2e:panorama-tour:public

      - name: Public demo boundary end-to-end test
        run: pnpm --filter @hatinh/web test:e2e:public-demo-boundary

      - name: Production-like real PSV public-media rejection E2E
        run: pnpm --filter @hatinh/web test:e2e:production-panorama:real

      - name: Customer Demo 360 media-policy end-to-end test
        run: pnpm --filter @hatinh/web test:e2e:customer-demo-360

      - name: Production-build Photo Sphere Viewer panorama smoke test
        run: pnpm --filter @hatinh/web test:e2e:panorama-tour:real

      - name: Production-build multi-destination reference-parity immersive E2E
        run: pnpm --filter @hatinh/web test:e2e:reference-parity

      - name: Production-build multi-destination real PSV directional-arrow E2E
        run: pnpm --filter @hatinh/web test:e2e:reference-parity:real

      - name: Production manifest end-to-end smoke tests
        run: pnpm --filter @hatinh/web exec playwright test --config=playwright.production.config.ts

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/admin/playwright-report
            apps/admin/test-results
          if-no-files-found: ignore

      - name: Stop MinIO
        if: always()
        run: docker rm --force ci-minio

  api-image:
    name: API image smoke check
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build --file infra/docker/api.Dockerfile --tag hatinh-immersive-api:${{ github.sha }} .

      - name: Run API image
        run: >-
          docker run --detach --name hatinh-immersive-api --publish 3000:3000
          --env DATABASE_SSL=true
          --env DATABASE_URL=postgresql://healthcheck:healthcheck@127.0.0.1:5432/health?sslmode=require
          hatinh-immersive-api:${{ github.sha }}

      - name: Wait for API health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/api/v1/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs hatinh-immersive-api
          exit 1

      - name: Verify Docker health status
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' hatinh-immersive-api)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 1
          done
          docker inspect hatinh-immersive-api
          exit 1

      - name: Remove API container
        if: always()
        run: docker rm --force hatinh-immersive-api
